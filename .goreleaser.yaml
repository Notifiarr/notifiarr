# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
pro: true

project_name: notifiarr

# GoReleaser --nightly is "not a tagged GitHub release". CHANNEL picks the Docker tag:
#   unstable = push to the unstable branch (manual)
#   nightly  = daily cron from main
#   release  = v* tags
nightly:
  # This is why REVISION is still computed (once, in the channel job) even
  # though {{ .Version }} already includes it on --nightly: this template is
  # what *creates* that version (package names, man pages, ProductVersion).
  # Tagged builds keep .Version as the semver tag. ldflags Revision, Darwin
  # CFBundleVersion, and Windows FileVersion still need the count.
  # golift.io/version.Version is the x.y.z prefix of .Version, not this
  # full string: the website and GUI append Revision themselves.
  # CFBundleShortVersionString / FileVersion x.y.z also use that prefix
  # (not .RawVersion: that stays on the last tag during --nightly).
  version_template: "{{ incpatch .Version }}-{{ .Env.REVISION }}"

before:
  hooks:
    - go mod tidy
    # Fake dist so swagger generate can import frontend before npm run build.
    - mkdir -p frontend/dist
    - sh -c 'echo "Fake frontend build." > frontend/dist/index.html'
    - go generate ./frontend/src/api
    - go generate ./frontend
    - go run github.com/davidnewhall/md2roff@v0.0.1 --manual notifiarr --version "{{.Version}}" --date "{{.Date}}" examples/MANUAL.md
    - go run github.com/davidnewhall/md2roff@v0.0.1 --manual notifiarr --version "{{.Version}}" --date "{{.Date}}" README.md
    - gzip -9nf examples/MANUAL
    - mv -f examples/MANUAL.gz notifiarr.1.gz
    # rsrc only embeds icon+manifest. goversioninfo does that and VERSIONINFO
    # (Explorer File version). -64: before-hooks run on darwin/arm64 too;
    # the Windows build is amd64. Skip JSON: versions come from these flags.
    # --nightly rewrites .Version (incpatch-REVISION) but .RawVersion / .Major /
    # .Minor / .Patch stay on the last tag. FileVersion is the x.y.z prefix of
    # .Version plus REVISION; goversioninfo fills the numeric fields from that
    # string. ProductVersion string is .Version (nightly includes -REVISION).
    - >-
      go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      -64 -skip-versioninfo
      -icon init/windows/application.ico
      -manifest init/windows/manifest.xml
      -company "Go Lift"
      -copyright "© Go Lift (https://golift.io)"
      -description "Official Client for Notifiarr.com"
      -internal-name notifiarr
      -original-name notifiarr.exe
      -product-name Notifiarr
      -file-version "{{ index (split .Version "-") 0 }}.{{ .Env.REVISION }}"
      -product-version "{{ .Version }}"
      -translation 1033
      -charset 1200
      -o rsrc_windows_amd64.syso

builds:
  - id: notifiarr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
      - '386'
    # One linux ARM (v7). nFPM maps GOARM 6 and 7 both to Debian armhf, so
    # packaging both collides on packagecloud.
    goarm:
      - '7'
    flags:
      - -trimpath
    tags:
      - osusergo
      - netgo
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{ index (split .Version "-") 0 }}"
      - -X "golift.io/version.BuildDate={{.Date}}"
      - -X "golift.io/version.BuildUser={{.Env.USER}}"
      - -X "golift.io/version.Revision={{.Env.REVISION}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
  # energye/systray's Darwin backend is Objective-C (Cocoa). CGO_ENABLED=0
  # drops those symbols (undefined: nativeLoop, setInternalLoop, ...).
  # CI builds this on macos-latest (host clang). OSX_CROSS is only for a
  # local Linux snapshot with osxcross (o64-clang / oa64-clang).
  - id: notifiarr-darwin
    binary: Notifiarr
    env:
      - CGO_ENABLED=1
      # Go 1.27's darwin objects are macOS 13; a lower min just makes ld warn.
      - CGO_LDFLAGS=-mmacosx-version-min=13.0
      - CGO_CFLAGS=-mmacosx-version-min=13.0
      - MACOSX_DEPLOYMENT_TARGET=13.0
      - 'CC={{ if isEnvSet "OSX_CROSS" }}{{ if eq .Arch "amd64" }}o64-clang{{ else }}oa64-clang{{ end }}{{ else }}clang{{ end }}'
      - 'CXX={{ if isEnvSet "OSX_CROSS" }}{{ if eq .Arch "amd64" }}o64-clang++{{ else }}oa64-clang++{{ end }}{{ else }}clang++{{ end }}'
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    tags:
      - osusergo
      - netgo
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{ index (split .Version "-") 0 }}"
      - -X "golift.io/version.BuildDate={{.Date}}"
      - -X "golift.io/version.BuildUser={{.Env.USER}}"
      - -X "golift.io/version.Revision={{.Env.REVISION}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
  - id: notifiarr-freebsd
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
      - arm
      - '386'
    # One ARM (v7). Dual GOARM would collide on notifiarr-*.armhf.txz.
    # No freebsd/arm64: the auto-updater / historical GitHub set is
    # amd64, i386, armhf only.
    goarm:
      - '7'
    flags:
      - -trimpath
    tags:
      - osusergo
      - netgo
      - nodbus
    ldflags:
      - -s -w
      - -X "golift.io/version.Version={{ index (split .Version "-") 0 }}"
      - -X "golift.io/version.BuildDate={{.Date}}"
      - -X "golift.io/version.BuildUser={{.Env.USER}}"
      - -X "golift.io/version.Revision={{.Env.REVISION}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
  - id: notifiarr-windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    # Current WINDOWS_BUILD_FLAGS omit netgo.
    tags:
      - osusergo
    ldflags:
      - -s -w
      - -H=windowsgui
      - -X "golift.io/version.Version={{ index (split .Version "-") 0 }}"
      - -X "golift.io/version.BuildDate={{.Date}}"
      - -X "golift.io/version.BuildUser={{.Env.USER}}"
      - -X "golift.io/version.Revision={{.Env.REVISION}}"
      - -X "golift.io/version.Branch={{.ShortCommit}} [{{.Branch}}]"
    hooks:
      post:
        - cmd: bash .github/scripts/signexe.sh "{{ .Path }}"

universal_binaries:
  - id: notifiarr-darwin
    ids: [notifiarr-darwin]
    replace: true
    name_template: Notifiarr

# Quill (Linux) can only sign/notarize the raw binary. A Gatekeeper-valid
# .app inside a DMG has to be codesign'd + notarytool'd on macOS.
# Enabled when the Darwin split job imported the P12 into a keychain.
notarize:
  macos_native:
    - enabled: '{{ isEnvSet "KEYCHAIN_PATH" }}'
      # These pipes match Extra.ID on the .app / .dmg, not the Darwin build id.
      ids:
        - notifiarr-app
        - notifiarr-dmg
      use: dmg
      sign:
        keychain: "{{ .Env.KEYCHAIN_PATH }}"
        identity: "{{ .Env.MACOS_SIGN_IDENTITY }}"
        options: [runtime]
        entitlements: init/macos/entitlements.plist
      notarize:
        profile_name: "{{ .Env.MACOS_NOTARY_PROFILE_NAME }}"
        wait: true

app_bundles:
  - id: notifiarr-app
    name: Notifiarr
    ids: [notifiarr-darwin]
    icon: init/macos/Notifiarr.app/Contents/Resources/Notifiarr.icns
    bundle: io.golift.notifiarr
    extra_files:
      - src: init/macos/Notifiarr.app/Contents/Resources/terminal-notifier.app
        dst: Contents/Resources/terminal-notifier.app
      - src: init/macos/Notifiarr.app/Contents/Resources/Images/notifiarr.png
        dst: Contents/Resources/Images/notifiarr.png
      - src: examples/notifiarr.conf.example
        dst: Contents/Resources/notifiarr.conf.example
      - src: notifiarr.1.gz
        dst: Contents/Resources/notifiarr.1.gz
    templated_extra_files:
      - src: init/macos/Info.plist.tmpl
        dst: Contents/Info.plist

dmg:
  - id: notifiarr-dmg
    name: Notifiarr
    ids: [notifiarr-app]
    use: appbundle

source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  prefix_template: '{{ .ProjectName }}-{{ .Version }}/'

# AUR notifiarr-bin: .github/scripts/aur_publish.sh after continue --merge
# (CHANNEL=release). Binary package; do not add aur_sources.

archives:
  # pkg/update/check.go only matches assets ending in .exe.zip.
  # Linux/FreeBSD GitHub+AUR names are gzipped binaries staged after --split
  # by .github/scripts/legacy_gz.sh (GoReleaser gz archives wrap extra files).
  - id: windows
    ids: [notifiarr-windows]
    formats: [zip]
    name_template: '{{ .ProjectName }}.{{ .Arch }}.exe'
    wrap_in_directory: false
    files:
      - LICENSE
      - src: examples/notifiarr.conf.example
        dst: notifiarr.conf.example
      - src: examples/MANUAL.html
        dst: notifiarr-manual.html
      - README.html

nfpms:
  - id: notifiarr-packages
    ids: [notifiarr]
    # Default is notifiarr_VERSION_linux_386.deb. Conventional names match
    # v0.9.7 (notifiarr_0.9.7-3273_amd64.deb). nFPM uses ~ for semver
    # prerelease; GitHub replaces tilde with a dot, so swap it for a hyphen.
    # GoReleaser replace is STRING OLD NEW (not sprig OLD NEW STRING).
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    vendor: Go Lift
    homepage: https://notifiarr.com
    maintainer: David Newhall II <captain at golift dot io>
    description: Official Client for Notifiarr.com
    license: MIT
    # GoReleaser does not template nfpms.release. Tagged linux split inserts
    # `release: REVISION` after this marker. --nightly leaves it unset.
    # nfpm-release:
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    section: default
    priority: extra
    provides:
      - notifiarr
    rpm:
      signature:
        key_file: "{{ .Env.GPG_SIGNING_KEY }}"
    deb:
      signature:
        key_file: "{{ .Env.GPG_SIGNING_KEY }}"
        type: origin
    # nFPM maps scripts.postinstall to Arch post_install only. Upgrades must
    # still claim leftover root:root configs (same script is idempotent).
    archlinux:
      scripts:
        postupgrade: init/systemd/after-install.sh
    scripts:
      preinstall: init/systemd/before-install.sh
      postinstall: init/systemd/after-install.sh
      preremove: init/systemd/before-remove.sh
    contents:
      - dst: /etc/notifiarr
        type: dir
        file_info:
          mode: 0755
      - dst: /var/log/notifiarr
        type: dir
        file_info:
          mode: 0755
      - src: examples/notifiarr.conf.example
        dst: /etc/notifiarr/notifiarr.conf
        type: config|noreplace
        file_info:
          mode: 0644
      - src: examples/notifiarr.conf.example
        dst: /etc/notifiarr/notifiarr.conf.example
        type: config
        file_info:
          mode: 0644
      - src: notifiarr.1.gz
        dst: /usr/share/man/man1/notifiarr.1.gz
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/notifiarr/LICENSE
        file_info:
          mode: 0644
      - src: examples/MANUAL.html
        dst: /usr/share/doc/notifiarr/notifiarr_manual.html
        file_info:
          mode: 0644
      - src: examples/MANUAL.md
        dst: /usr/share/doc/notifiarr/MANUAL.md
        file_info:
          mode: 0644
      - src: README.html
        dst: /usr/share/doc/notifiarr/README.html
        file_info:
          mode: 0644
      - src: examples/compose.yml
        dst: /usr/share/doc/notifiarr/compose.yml
        file_info:
          mode: 0644
      - src: examples/prometheus.yml
        dst: /usr/share/doc/notifiarr/prometheus.yml
        file_info:
          mode: 0644
      - src: examples/dashboard.json
        dst: /usr/share/doc/notifiarr/dashboard.json
        file_info:
          mode: 0644
      - src: examples/notifiarr.conf.example
        dst: /usr/share/doc/notifiarr/notifiarr.conf.example
        file_info:
          mode: 0644
      - src: frontend/public/notifiarr.png
        dst: /usr/share/doc/notifiarr/notifiarr.png
        file_info:
          mode: 0644
      - src: init/systemd/notifiarr.service
        dst: /usr/lib/systemd/system/notifiarr.service
        type: config
        file_info:
          mode: 0644
      - src: init/systemd/notifiarr.tmpfiles
        dst: /usr/lib/tmpfiles.d/notifiarr.conf
        file_info:
          mode: 0644
      - src: init/linux/deb/usr/share/applications/notifiarr.desktop
        dst: /usr/share/applications/notifiarr.desktop
        file_info:
          mode: 0644
      - src: init/linux/deb/etc/apt/apt.conf.d/999notifiarr
        dst: /etc/apt/apt.conf.d/999notifiarr
        packager: deb
        file_info:
          mode: 0644

