services:
  # Replace or pass in APPDATA (below).
  notifiarr:
    container_name: notifiarr
    hostname: notifiarr
    image: golift/notifiarr
    # Nvidia GPU snapshots: host needs NVIDIA drivers + NVIDIA Container Toolkit.
    # :cuda is an alias of :ubuntu (same image). Alpine :latest is not recommended.
    # image: golift/notifiarr:cuda
    # gpus: all
    # Docker run equivalent: --gpus all
    restart: unless-stopped
    ports:
      - "5454:5454"
    volumes:
      - ${APPDATA}/notifiarr:/config
      - /var/run/utmp:/var/run/utmp
      - /etc/machine-id:/etc/machine-id
